<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caladan Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { border-radius: 8px; }
        .list-group-item { border: none; padding: 1rem 1.25rem; margin-bottom: 0.5rem; border-radius: 8px !important; background: white; }
        #calendar-modal .modal-body { height: 70vh; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <img src="/static/logo.svg" alt="Caladan Logo" height="40" class="me-2 bg-white rounded p-1">
                Caladan CalDAV
            </span>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3">Welcome, <strong>{{ username }}</strong></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <h4 class="mb-3">My Calendars</h4>
                <div id="calendar-list">
                    <!-- Loaded via JS -->
                </div>

                <h4 class="mt-5 mb-3">Shared with Me</h4>
                <div id="shared-with-me" class="list-group">
                    <!-- Loaded via JS -->
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card p-3 mb-4">
                    <h5>Create Calendar</h5>
                    <form id="create-calendar-form">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="new-calendar-name" class="form-control" placeholder="e.g. work" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create</button>
                    </form>
                </div>

                <div class="card p-3 mb-4">
                    <h5>Share Calendar</h5>
                    <form id="share-form">
                        <div class="mb-3">
                            <label class="form-label">Calendar</label>
                            <select id="calendar-select" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target User (Authentik Username)</label>
                            <input type="text" id="target-user" class="form-control" placeholder="e.g. alice" required list="user-suggestions" autocomplete="off">
                            <datalist id="user-suggestions"></datalist>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Share</button>
                    </form>
                </div>
                
                <div class="card p-3">
                    <h5>CalDAV Settings</h5>
                    <p class="small text-muted">Use these details in your client:</p>
                    <code class="d-block p-2 bg-light mb-2">URL: https://{{ request.host }}/{{ username }}/</code>
                    <code class="d-block p-2 bg-light">User: {{ username }}</code>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar View Modal -->
    <div class="modal fade" id="calendarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="calendarModalLabel">Calendar View</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="fullcalendar"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let calendarInstance = null;

        async function loadData() {
            const res = await fetch('/api/calendars');
            const data = await res.json();
            
            // Render My Calendars
            const list = document.getElementById('calendar-list');
            const select = document.getElementById('calendar-select');
            list.innerHTML = '';
            select.innerHTML = '';
            
            data.my_calendars.forEach(cal => {
                const calDiv = document.createElement('div');
                calDiv.className = 'card mb-3 p-3';
                calDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${cal.name}</strong>
                            <div class="small text-muted">Shared with: ${cal.shares.length ? cal.shares.join(', ') : 'No one'}</div>
                        </div>
                        <button class="btn btn-sm btn-outline-primary" onclick="openCalendar('${cal.name}')">View</button>
                    </div>
                    ${cal.shares.length ? `
                        <div class="mt-2">
                            ${cal.shares.map(u => `<span class="badge bg-secondary me-1">${u} <a href="#" onclick="unshare('${cal.name}', '${u}')" class="text-white text-decoration-none ms-1">&times;</a></span>`).join('')}
                        </div>
                    ` : ''}
                `;
                list.appendChild(calDiv);
                
                const opt = document.createElement('option');
                opt.value = cal.name;
                opt.textContent = cal.name;
                select.appendChild(opt);
            });

            // Render Shared with Me
            const sharedList = document.getElementById('shared-with-me');
            sharedList.innerHTML = '';
            if (data.shared_with_me.length === 0) {
                sharedList.innerHTML = '<div class="text-muted">No calendars shared with you yet.</div>';
            }
            data.shared_with_me.forEach(s => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <div>
                        <strong>${s.local_name}</strong>
                        <div class="small text-muted">Owner: ${s.owner}</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="openCalendar('${s.local_name}')">View</button>
                        <code class="small bg-light p-1">/${s.local_name}/</code>
                    </div>
                `;
                sharedList.appendChild(item);
            });
        }

        document.getElementById('create-calendar-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-calendar-name').value;
            
            const res = await fetch('/api/create_calendar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            
            if (res.ok) {
                document.getElementById('new-calendar-name').value = '';
                loadData();
            } else {
                const err = await res.json();
                alert('Error: ' + err.error);
            }
        };

        document.getElementById('share-form').onsubmit = async (e) => {
            e.preventDefault();
            const calendar = document.getElementById('calendar-select').value;
            const target_user = document.getElementById('target-user').value;
            
            await fetch('/api/share', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({calendar, target_user})
            });
            document.getElementById('target-user').value = '';
            loadData();
        };

        async function unshare(calendar, target_user) {
            await fetch('/api/unshare', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({calendar, target_user})
            });
            loadData();
        }

        function logout() {
            window.location.href = '/logout';
        }

        async function openCalendar(calendarName) {
            const modalEl = document.getElementById('calendarModal');
            const modal = new bootstrap.Modal(modalEl);
            document.getElementById('calendarModalLabel').textContent = `Calendar: ${calendarName}`;
            modal.show();
            
            // Wait for modal to be visible to render calendar correctly
            modalEl.addEventListener('shown.bs.modal', async () => {
                if (calendarInstance) {
                    calendarInstance.destroy();
                }
                
                const calendarEl = document.getElementById('fullcalendar');
                calendarInstance = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay'
                    },
                    events: `/api/calendars/${calendarName}/events`
                });
                calendarInstance.render();
            }, { once: true });
            loadData();
        }

        // Autocomplete Logic
        let debounceTimer;
        const targetUserInput = document.getElementById('target-user');
        const userDatalist = document.getElementById('user-suggestions');

        targetUserInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value;
            
            if (query.length < 2) {
                userDatalist.innerHTML = '';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
                    if (res.ok) {
                        const users = await res.json();
                        userDatalist.innerHTML = '';
                        users.forEach(user => {
                            const option = document.createElement('option');
                            option.value = user;
                            userDatalist.appendChild(option);
                        });
                    }
                } catch (err) {
                    console.error('Error fetching users:', err);
                }
            }, 300); // 300ms debounce
        });

        loadData();
    </script>
</body>
</html>
